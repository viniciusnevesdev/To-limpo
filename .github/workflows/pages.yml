name: Testar e publicar PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar cálculo de tempo e validação de backup
        run: npm test
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site/icons
          cp index.html styles.css app.js model.js storage.js updates.js manifest.json sw.js .nojekyll _site/
          cp icons/*.png _site/icons/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
