<!doctype html>
<html lang="pt-BR" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tô limpo?">
  <meta name="description" content="Seu tempo, do seu jeito. Contadores pessoais, privados e offline.">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Tô limpo?</title>
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <div><p class="eyebrow">TÔ LIMPO?</p><h1 id="page-title">Meu tempo</h1></div>
      <button class="round-button add-button" id="add" aria-label="Criar contador"></button>
    </header>
    <aside id="update-banner" class="update-banner" hidden><span>Nova versão disponível</span><button id="update-now">Atualizar</button></aside>
    <main id="content" tabindex="-1"><p class="loading">Abrindo seus contadores…</p></main>
    <nav class="tab-bar" aria-label="Navegação principal">
      <button data-page="home" aria-current="page"><span data-icon="home"></span><small>Início</small></button>
      <button data-page="history"><span data-icon="history"></span><small>Histórico</small></button>
      <button data-page="settings"><span data-icon="settings"></span><small>Ajustes</small></button>
    </nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><h2 id="sheet-title"></h2><button id="close-sheet" class="icon-button" aria-label="Fechar"></button></header><div id="sheet-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="backup-file" accept="application/json,.json" hidden>
  <noscript>Ative o JavaScript para usar os contadores. Seus dados ficam neste dispositivo.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
